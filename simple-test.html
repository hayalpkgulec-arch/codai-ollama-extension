<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
</head>
<body>
    <h1>Test</h1>
    <input type="text" id="test" placeholder="Type and press Enter">
    <script>
        const input = document.getElementById('test');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                alert('Enter pressed!');
            }
        });
    </script>
</body>
</html>
